<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local3DAI Control</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Local3DAI</p>
            <h1>3D 到约束渲染</h1>
          </div>
          <button id="refreshButton" class="icon-button" title="刷新状态" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M5.7 9A7 7 0 0 1 17.7 6L20 8.3"/><path d="M18.3 15A7 7 0 0 1 6.3 18L4 15.7"/></svg>
          </button>
        </div>

        <form id="runForm" class="form-grid">
          <label class="field">
            <span>来源</span>
            <select id="sourceMode">
              <option value="existing_mesh">已有白模 GLB</option>
              <option value="hunyuan_reference">参考图 + Hunyuan3D</option>
              <option value="model_path">指定模型路径</option>
              <option value="procedural">程序化测试模型</option>
            </select>
          </label>

          <label class="field" data-mode-field="existing_mesh model_path">
            <span>模型路径</span>
            <input id="modelPath" type="text" value="/root/sakura/work/build/outputs/hunyuan_shape_sd_render/white_mesh.glb" />
          </label>

          <label class="field" data-mode-field="hunyuan_reference">
            <span>参考图</span>
            <input id="referenceFile" type="file" accept="image/png,image/jpeg,image/webp" />
          </label>

          <label class="field" data-mode-field="hunyuan_reference">
            <span>或参考图路径</span>
            <input id="referencePath" type="text" placeholder="/root/.../reference.png" />
          </label>

          <label class="field field-wide">
            <span>正向提示</span>
            <textarea id="prompt" rows="4"></textarea>
          </label>

          <label class="field field-wide">
            <span>负向提示</span>
            <textarea id="negativePrompt" rows="3"></textarea>
          </label>

          <div class="number-grid">
            <label class="field">
              <span>白模分辨率</span>
              <input id="renderResolution" type="number" min="512" max="2048" step="128" value="1536" />
            </label>
            <label class="field">
              <span>AI 宽度</span>
              <input id="aiWidth" type="number" min="512" max="2048" step="128" value="1536" />
            </label>
            <label class="field">
              <span>AI 高度</span>
              <input id="aiHeight" type="number" min="512" max="2048" step="128" value="1536" />
            </label>
            <label class="field">
              <span>候选数</span>
              <input id="candidates" type="number" min="1" max="8" step="1" value="1" />
            </label>
            <label class="field">
              <span>步数</span>
              <input id="steps" type="number" min="1" max="80" step="1" value="42" />
            </label>
            <label class="field">
              <span>Seed</span>
              <input id="seed" type="number" step="1" value="20260610" />
            </label>
          </div>

          <label class="slider-row">
            <span>Canny 约束 <b id="cannyValue">2.85</b></span>
            <input id="cannyScale" type="range" min="0" max="3.5" step="0.05" value="2.85" />
          </label>

          <label class="slider-row">
            <span>Depth 约束 <b id="depthValue">0.55</b></span>
            <input id="depthScale" type="range" min="0" max="2.0" step="0.05" value="0.55" />
          </label>

          <label class="toggle-row">
            <input id="geometryLock" type="checkbox" checked />
            <span>几何锁定</span>
          </label>

          <button id="runButton" class="primary-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 9-14 9V3z"/></svg>
            <span>启动全流程</span>
          </button>
        </form>
      </section>

      <section class="status-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Run</p>
            <h2 id="jobTitle">待命</h2>
          </div>
          <span id="statusPill" class="status-pill">idle</span>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="stageRail" class="stage-rail">
          <span data-stage="prepare">准备</span>
          <span data-stage="3d">3D</span>
          <span data-stage="render">白模</span>
          <span data-stage="ai">AI</span>
          <span data-stage="score">评分</span>
          <span data-stage="complete">完成</span>
        </div>
        <pre id="logBox" class="log-box"></pre>

        <div class="model-box">
          <h3>模型状态</h3>
          <div id="modelStatus" class="model-status"></div>
        </div>
      </section>

      <section class="artifact-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Artifacts</p>
            <h2>结果预览</h2>
          </div>
          <a id="openWorkdir" class="text-link" href="#" target="_blank" rel="noreferrer">workdir</a>
        </div>

        <div class="preview-grid">
          <figure>
            <figcaption>白模</figcaption>
            <img id="whiteImage" alt="白模渲染" />
          </figure>
          <figure>
            <figcaption>最终渲染</figcaption>
            <img id="finalImage" alt="最终渲染" />
          </figure>
          <figure class="figure-wide">
            <figcaption>对照</figcaption>
            <img id="comparisonImage" alt="白模和最终渲染对照" />
          </figure>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
