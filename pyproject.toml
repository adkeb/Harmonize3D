[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-3d-ai-renderer"
version = "0.1.0"
description = "Local 3D to AI image rendering pipeline for Blender channels, scripted generation, and consistency ranking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dashscope>=1.25",
  "numpy>=1.24",
  "pillow>=10.0",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
ai = [
  "accelerate>=1.0",
  "diffusers>=0.35",
  "protobuf>=4.25",
  "sentencepiece>=0.2",
  "transformers>=4.45",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
local3dai = "local3dai.cli:main"
local3dai-web = "local3dai.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tools", "models", "outputs", "docs", ".venv"]
